function glowTexture(inner, outer) {

function makeShip(hullColor, accent) {

  // kanat ucu seritleri

    engines.push(new THREE.Vector3(sx, 0, 4.0));
  }
  // kokpit
  const cp = new THREE.Mesh(new THREE.SphereGeometry(0.75, 32, 16, 0, TAU, 0, Math.PI / 2), glass); cp.scale.set(0.85, 0.7, 2.2); cp.position.set(0, 0.55, -1.8); grp.add(cp);
  // govde paneli
  const spine = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 4.0), acc); spine.position.set(0, 0.78, 0.9); grp.add(spine);
  // motor izi + parlama

  for (const e of engines) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, color: 0x9ff7ff }));
    s.position.copy(e).add(new THREE.Vector3(0, 0, 0.3)); s.scale.set(3.2, 3.2, 1); grp.add(s);

    const lg = tg.createLinearGradient(0, 0, 0, 256); lg.addColorStop(0, 'rgba(200,255,255,0.95)'); lg.addColorStop(0.25, 'rgba(60,200,255,0.5)'); lg.addColorStop(1, 'rgba(20,80,255,0)');

  }

}

    planetGroup.position.set(6, -62, -20);
    moon.position.set(-22, 30, -120);
    sunGlow.position.set(30, -22, -130); sunGlow.scale.set(46, 46, 1);
    const spots = [[-16, -10, 8, 1.6], [18, 16, -10, 2.4], [-24, 34, -30, 3.4], [22, -26, 14, 1.2], [-6, 46, -60, 4.0], [30, 40, -50, 2.6], [-30, -30, -10, 2.0]];
    asteroids.forEach((a, i) => { a.userData.base.set(...spots[i].slice(0, 3)); a.userData.s = spots[i][3]; });
  } else {
    camera.position.set(0, 0, 60); camera.lookAt(0, -3, 0);
    planetGroup.position.set(16, -50, -30);
    moon.position.set(-60, 18, -140);
    sunGlow.position.set(48, -20, -150); sunGlow.scale.set(52, 52, 1);
    const spots = [[-30, -12, 6, 1.8], [34, 14, -10, 2.4], [-46, 18, -30, 3.0], [26, -18, 14, 1.2], [-10, 26, -60, 3.6], [52, 30, -50, 2.6], [-56, -22, -10, 2.0]];
    asteroids.forEach((a, i) => { a.userData.base.set(...spots[i].slice(0, 3)); a.userData.s = spots[i][3]; });
  }
}
layout();
sunGlow.visible = false;
const camBase = camera.position.clone();
const lookBase = new THREE.Vector3(0, portrait ? -6 : -3, 0);

// ---------- son islem ----------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.7, 0.5, 0.78);
composer.addPass(bloom);
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uSeed: { value: 0 }, uVig: { value: MODE === 'video' || MODE === 'still' ? 1 : 0.4 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uSeed; uniform float uVig; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))+uSeed)*43758.5453); }
    void main(){ vec4 c=texture2D(tDiffuse,vUv); float v=smoothstep(0.95,0.25,length(vUv-0.5)); c.rgb*=mix(1.0, mix(0.45,1.0,v), uVig);
      c.rgb+=(h(vUv*vec2(1920.,1080.))-0.5)*0.025*uVig; gl_FragColor=c; }`,
});
composer.addPass(finish);
composer.addPass(new OutputPass());

// ---------- deterministik zaman ----------
function shipPath(obj, u, from, to, lift, scale, startU, endU, yaw) {
  const k = (u - startU) / (endU - startU);
  if (k < 0 || k > 1) { obj.visible = false; return; }
  obj.visible = true;
  const e = k;
  obj.position.lerpVectors(from, to, e);
  obj.position.y += Math.sin(e * Math.PI) * lift;
  const dir = new THREE.Vector3().subVectors(to, from).normalize();
  obj.lookAt(obj.position.clone().sub(dir)); // burun -Z: hareket yonune bak
  obj.rotateZ(Math.sin(e * Math.PI) * 0.35 * yaw);
  obj.scale.setScalar(scale);
}

window.renderAt = function (t) {
  const u = (t % LOOP) / LOOP;
  const a = u * TAU;
  starMat.uniforms.uT.value = u;
  // kamera yavas suzulme (periyodik)
  camera.position.set(camBase.x + Math.sin(a) * 1.2, camBase.y + Math.cos(a) * 0.6, camBase.z);
  camera.lookAt(lookBase.x + Math.sin(a) * 0.4, lookBase.y, lookBase.z);
  nebMat.uniforms.uOff.value.set(Math.sin(a) * 0.004, Math.cos(a) * 0.002);
  planetMat.uniforms.uRot.value = 0.6 + Math.sin(a) * 0.035;
  asteroids.forEach((m) => {
    const d = m.userData, b = d.base;
    m.position.set(b.x + Math.sin(a + d.phase) * 0.8, b.y + Math.cos(a + d.phase) * 0.6, b.z);
    m.rotation.set(d.rot.x * 6 + Math.sin(a + d.phase) * 0.25, d.rot.y * 6 + a * 0 + Math.cos(a + d.phase) * 0.3, d.rot.z * 6);
    m.scale.setScalar(d.s);
  });
  if (MODE === 'video' || MODE === 'still') {
    const X = portrait ? 34 : 70;
    shipPath(hero, u, new THREE.Vector3(X, -14, 6), new THREE.Vector3(-X, 18, -18), 3, portrait ? 1.0 : 1.1, 0.08, 0.80, 1);
    shipPath(wing1, u, new THREE.Vector3(X + 10, -2, -40), new THREE.Vector3(-X - 10, 26, -70), 2, 0.8, 0.18, 0.92, 1);
    shipPath(wing2, u, new THREE.Vector3(X + 4, -8, -55), new THREE.Vector3(-X - 16, 20, -85), 2, 0.8, 0.24, 0.98, 1);
  } else {
    // simge / logo: gemi gezegenin onunde, sag ustte
    wing1.visible = wing2.visible = false; hero.visible = true;
    hero.position.set(27, 9, 18); hero.scale.setScalar(1.25);
    hero.lookAt(new THREE.Vector3(27 - 30, 9 - 16, 18 + 22));
    hero.rotateZ(-0.5);
  }
  placeGlint();
  finish.uniforms.uSeed.value = (t * 7.31) % 100;
  if (MODE === 'logo') renderer.render(scene, camera); else composer.render();
};
window.sceneReady = true;
</script></body></html>
