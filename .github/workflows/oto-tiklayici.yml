name: Oto Tiklayici APK

on:
  push:
    paths:
      - 'OtoTiklayici/**'
      - '.github/workflows/oto-tiklayici.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oto-tiklayici-${{ github.ref }}
  cancel-in-progress: true

env:
  HAS_KEYSTORE: ${{ secrets.OTO_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OtoTiklayici

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK paketleri (API 37.2, build-tools 37)
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Yayın anahtarı (isteğe bağlı, GitHub Secrets)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.OTO_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/oto-release.keystore"
          echo "OTO_KEYSTORE_PATH=$RUNNER_TEMP/oto-release.keystore" >> "$GITHUB_ENV"

      - name: Testler, lint ve derleme
        env:
          OTO_KEYSTORE_PASSWORD: ${{ secrets.OTO_KEYSTORE_PASSWORD }}
          OTO_KEY_ALIAS: ${{ secrets.OTO_KEY_ALIAS }}
          OTO_KEY_PASSWORD: ${{ secrets.OTO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease assembleDebug --stacktrace

      - name: APK dosyalarını hazırla
        run: |
          mkdir -p out
          VERSION="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk out/OtoTiklayici.apk
          cp app/build/outputs/apk/release/app-release.apk "out/OtoTiklayici-v$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/OtoTiklayici-debug-v$VERSION.apk"
          ls -la out

      - name: Derleme çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: OtoTiklayici-APK
          path: OtoTiklayici/out/*.apk

      - name: Test ve lint raporlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OtoTiklayici-raporlar
          path: |
            OtoTiklayici/app/build/reports/
            OtoTiklayici/app/build/test-results/

      - name: GitHub Release (oto-tiklayici)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="oto-tiklayici"
          VERSION="1.0.${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/*.apk \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "Oto Tıklayıcı v$VERSION" \
            --notes "Oto Tıklayıcı v$VERSION (dal: ${{ github.ref_name }}, commit: ${{ github.sha }})

          Kurulum: OtoTiklayici.apk dosyasını telefona indir ve kur. Sonra Ayarlar › Erişilebilirlik › Oto Tıklayıcı servisini aç.
          Android 13+ kısıtlanmış ayar uyarısında: Uygulama bilgisi › ⋮ › Kısıtlanmış ayarlara izin ver.

          • Tek nokta, çoklu nokta ve kaydırma hedefleri
          • Kaydet & tekrarla: dokunma, uzun basma, kaydırma, sürükleme ve çoklu parmak hareketleri gerçek zamanlamasıyla
          • Tur / süre / sonsuz tekrar, hız çarpanı, geri sayım, rastgele gecikme ve konum (insan gibi)
          • Ses tuşuyla durdurma, hızlı ayar kutucuğu, makro kaydetme/düzenleme, JSON yedekleme
          • Android 8.0 – 17 (API 26–37), Material You arayüz"
