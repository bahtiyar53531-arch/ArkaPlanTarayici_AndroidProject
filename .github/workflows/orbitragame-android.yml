name: ORBITRAGAME.SPACE Android

on:
  push:
    paths:
      - "OrbitraGame/**"
      - ".github/workflows/orbitragame-android.yml"
    tags:
      - "orbitragame-v*"
  pull_request:
    paths:
      - "OrbitraGame/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test + APK derleme
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OrbitraGame
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release imza anahtarini hazirla (secret varsa)
        env:
          KEYSTORE_B64: ${{ secrets.ORBITRA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORBITRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORBITRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORBITRA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "Imza secret'lari tanimli degil: yalnizca debug APK uretilecek."
          fi

      - name: Birim + arayuz testleri
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Debug APK + Lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Release APK (imzali)
        if: env.SIGNED_RELEASE == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Imza anahtarini temizle
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ORBITRAGAME.SPACE-APK
          path: |
            OrbitraGame/app/build/outputs/apk/debug/*.apk
            OrbitraGame/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-raporlari
          path: |
            OrbitraGame/app/build/reports/
            OrbitraGame/core/build/reports/
            OrbitraGame/app/build/screenshots/

  release:
    name: GitHub Release (orbitragame-v* etiketi ile)
    needs: build
    if: startsWith(github.ref, 'refs/tags/orbitragame-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ORBITRAGAME.SPACE-APK
          path: apk
      - name: Surum olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=(apk/**/*.apk)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ORBITRAGAME.SPACE ${GITHUB_REF_NAME#orbitragame-}" \
            --notes "ORBITRAGAME.SPACE Android oyun uygulamasi. Kurulum: OrbitraGame/docs/KURULUM.md"
