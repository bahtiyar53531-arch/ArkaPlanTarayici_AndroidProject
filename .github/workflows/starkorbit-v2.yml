                      text = "Proxy Sifirla (Dogrudan Baglanti)"
                      setOnClickListener {
                          clearWebViewProxy()
                      }
                  }

                  layout.addView(statusTv)
                  layout.addView(toggleVpnBtn)
                  layout.addView(proxyInput)
                  layout.addView(applyProxyBtn)
                  layout.addView(clearProxyBtn)

                  AlertDialog.Builder(this)
                      .setTitle("StarkOrbit VPN ve Proxy Kalkani")
                      .setView(layout)
                      .setPositiveButton("Kapat", null)
                      .show()
              }

              private fun startStarkVpn() {
                  val intent = Intent(this, StarkVpnService::class.java).apply {
                      action = StarkVpnService.ACTION_CONNECT
                  }
                  startService(intent)
                  StarkVpnService.isRunning = true
                  vpnStatusButton.text = "VPN: ACIK"
                  Toast.makeText(this, "StarkOrbit Gaming VPN (1.1.1.1 Tuneli) Aktif!", Toast.LENGTH_SHORT).show()
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 909 && resultCode == RESULT_OK) {
                      startStarkVpn()
                  }
              }

              private fun applyWebViewProxy(proxyRule: String) {
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.PROXY_OVERRIDE)) {
                      val proxyConfig = ProxyConfig.Builder()
                          .addProxyRule(proxyRule)
                          .addDirect()
                          .build()
                      ProxyController.getInstance().setProxyOverride(
                          proxyConfig,
                          Executors.newSingleThreadExecutor()
                      ) {
                          runOnUiThread {
                              browserService?.activeProxySummary = proxyRule
                              Toast.makeText(this, "Tarayici Proxy Aktif: $proxyRule", Toast.LENGTH_SHORT).show()
                              browserService?.getActiveTab()?.webView?.reload()
                          }
                      }
                  } else {
                      Toast.makeText(this, "Cihaz WebView surumu ProxyOverride desteklemiyor", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun clearWebViewProxy() {
                  if (WebViewFeature.isFeatureSupported(WebViewFeature.PROXY_OVERRIDE)) {
                      ProxyController.getInstance().clearProxyOverride(
                          Executors.newSingleThreadExecutor()
                      ) {
                          runOnUiThread {
                              browserService?.activeProxySummary = "Dogrudan Baglanti"
                              Toast.makeText(this, "Proxy temizlendi", Toast.LENGTH_SHORT).show()
                              browserService?.getActiveTab()?.webView?.reload()
                          }
                      }
                  }
              }

