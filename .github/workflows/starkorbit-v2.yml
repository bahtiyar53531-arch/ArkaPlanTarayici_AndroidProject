                                  themeSecondaryColor = Color.parseColor("#00F0FF")
                              }
                          }
                          urlEditText.background = makeRoundedBg(Color.parseColor("#070A17"), themeAccentColor, 20f, 2)
                          floatingHudButton.background = makeRoundedBg(Color.parseColor("#CC10172E"), themeAccentColor, 99f, 3)
                          refreshTabStrip()
                      }
