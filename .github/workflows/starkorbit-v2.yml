              private fun toggleFullscreenGameMode(enable: Boolean) {
                  isFullscreenGameMode = enable
                  val tabHeader = mainVerticalLayout.getChildAt(0)
                  if (enable) {
                      tabHeader.visibility = View.GONE
                      topNavBar.visibility = View.GONE
                      floatingHudButton.visibility = View.VISIBLE
                      hideSystemBars()
                      Toast.makeText(
                          this,
                          "Tam Ekran Oyun Modu Aktif! Sagdaki MENU butonundan kontrollere ulasabilirsin.",
                          Toast.LENGTH_SHORT
                      ).show()
                  } else {
                      tabHeader.visibility = View.VISIBLE
                      topNavBar.visibility = View.VISIBLE
                      gamePadBar.visibility = if (isGamePadVisible) View.VISIBLE else View.GONE
                      floatingHudButton.visibility = View.GONE
                      showSystemBars()
                  }
              }

              private fun hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let { controller ->
                          controller.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          controller.systemBarsBehavior =
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          )
                  }
              }

              private fun showSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.show(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }

              private fun toggleOrientationLock() {
                  isLandscapeLocked = !isLandscapeLocked
                  requestedOrientation = if (isLandscapeLocked) {
                      ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  } else {
                      ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                  }
                  Toast.makeText(
                      this,
                      if (isLandscapeLocked) "Yatay Oyun Modu (Landscape) Kilitlendi" else "Ekran Yonu Serbest",
                      Toast.LENGTH_SHORT
                  ).show()
              }

              private fun showFloatingHudMenu() {
                  val options = arrayOf(
                      "Tam Ekrandan Cik (Ust Bari Goster)",
                      if (gamePadBar.visibility == View.VISIBLE) "Alt Oyun Tuslarini Gizle" else "Alt Oyun Tuslarini Goster",
                      if (isLandscapeLocked) "Yatay Kilidi Kaldir (Dikey/Oto)" else "Ekrani Yatay Kilitle (DarkOrbit Modu)",
                      "Yeni Arka Plan Sekmesi Ac",
                      "VPN ve Proxy Kalkani",
                      "Aktif Sekmeyi Yenile"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("StarkOrbit Hizli Oyun Menusu")
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> toggleFullscreenGameMode(false)
                              1 -> {
                                  isGamePadVisible = gamePadBar.visibility != View.VISIBLE
                                  gamePadBar.visibility = if (isGamePadVisible) View.VISIBLE else View.GONE
                              }
                              2 -> toggleOrientationLock()
                              3 -> {
                                  browserService?.createNewTab(loadHomeDashboard = true)
                                  toggleFullscreenGameMode(false)
                              }
                              4 -> showVpnAndProxyDialog()
                              5 -> browserService?.getActiveTab()?.webView?.reload()
                          }
                      }
                      .show()
              }

