                              else "Sekme ekran kapaliyken bile her ${values[which]} saniyede yenilenecek",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      .show()
              }

              private fun showThemeDialog() {
                  val themes = arrayOf(
                      "StarkOrbit Cyber Cyan (#00F0FF)",
                      "MMO Crimson Red (#EF4444)",
                      "EIC Azure Blue (#3B82F6)",
                      "VRU Emerald Green (#10B981)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("StarkOrbit Sirket ve Siber Temasi")
                      .setItems(themes) { _, which ->
                          when (which) {
                              0 -> {
                                  themeAccentColor = Color.parseColor("#00F0FF")
                                  themeSecondaryColor = Color.parseColor("#FF2A85")
                              }
                              1 -> {
