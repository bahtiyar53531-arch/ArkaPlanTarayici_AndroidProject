                              if (isSelected) themeAccentColor else Color.parseColor("#2B3860"),
                              20f,
                              if (isSelected) 3 else 1
                          )
                      }

                      val titleView = TextView(this).apply {
                          text = "● ${tab.title}"
                          setTextColor(if (isSelected) Color.WHITE else Color.parseColor("#94A8D0"))
                          textSize = 12f
                          typeface = if (isSelected) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                          maxLines = 1
                          ellipsize = TextUtils.TruncateAt.END
                          setOnClickListener {
                              service.switchToTab(tab.id)
                              syncBottomBarWithActiveTab()
                          }
                      }

                      val closeView = TextView(this).apply {
                          text = "  X"
                          setTextColor(Color.parseColor("#FF2A85"))
                          textSize = 13f
                          typeface = Typeface.DEFAULT_BOLD
                          setOnClickListener {
                              service.closeTab(tab.id)
                              syncBottomBarWithActiveTab()
