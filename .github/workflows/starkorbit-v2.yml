                  for (tab in service.tabs) {
                      val isSelected = tab.id == service.activeTabId
                      val chipLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(22, 8, 14, 8)
                          background = makeRoundedBg(
