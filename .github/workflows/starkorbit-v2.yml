          class StarkVpnService : VpnService() {
              companion object {
                  const val ACTION_CONNECT = "org.arkaplan.tarayici.VPN_CONNECT"
                  const val ACTION_DISCONNECT = "org.arkaplan.tarayici.VPN_DISCONNECT"
                  var isRunning: Boolean = false
              }

              private var vpnInterface: ParcelFileDescriptor? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_DISCONNECT) {
                      disconnectVpn()
                      return START_NOT_STICKY
                  }
                  establishVpnTunnel()
                  return START_STICKY
              }

              private fun establishVpnTunnel() {
                  try {
                      vpnInterface?.close()
                      val builder = Builder()
                          .setSession("StarkOrbit Gaming VPN")
                          .setMtu(1500)
                          .addAddress("10.88.0.2", 32)
                          .addDnsServer("1.1.1.1")
                          .addDnsServer("1.0.0.1")
                          .addDnsServer("8.8.8.8")
                          .addRoute("10.88.0.0", 24)
                          .addRoute("1.1.1.1", 32)
                          .addRoute("1.0.0.1", 32)

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          builder.setMetered(false)
                      }

                      vpnInterface = builder.establish()
                      isRunning = vpnInterface != null
                  } catch (e: Exception) {
                      isRunning = false
                  }
              }

              private fun disconnectVpn() {
                  try {
                      vpnInterface?.close()
                  } catch (_: Exception) {
                  }
                  vpnInterface = null
                  isRunning = false
                  stopSelf()
              }

              override fun onDestroy() {
                  disconnectVpn()
                  super.onDestroy()
              }
          }

          class AlwaysActiveWebView(context: Context) : WebView(context) {
              var keepRunningInBackground: Boolean = true

              override fun onWindowVisibilityChanged(visibility: Int) {
                  if (keepRunningInBackground && visibility != View.VISIBLE) {
                      super.onWindowVisibilityChanged(View.VISIBLE)
                  } else {
                      super.onWindowVisibilityChanged(visibility)
                  }
              }

              override fun onWindowFocusChanged(hasWindowFocus: Boolean) {
                  if (keepRunningInBackground && !hasWindowFocus) {
                      super.onWindowFocusChanged(true)
                  } else {
                      super.onWindowFocusChanged(hasWindowFocus)
                  }
              }
            }
              

          data class BrowserTab(
              val id: Int,
              val webView: AlwaysActiveWebView,
              var title: String = "Yeni Sekme",
              var url: String = "",
              var isDesktopMode: Boolean = true,
              var isAntiAfkEnabled: Boolean = true,
              var autoRefreshSeconds: Int = 0,
              var lastRefreshTimestamp: Long = System.currentTimeMillis()
          )

          class BrowserForegroundService : Service() {
              companion object {
                  const val CHANNEL_ID = "StarkOrbitBrowserChannel"
                  const val NOTIFICATION_ID = 2002
                  const val ACTION_STOP_SERVICE = "org.arkaplan.tarayici.STOP_SERVICE"

                  const val DESKTOP_USER_AGENT =
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                  const val MOBILE_USER_AGENT =
                      "Mozilla/5.0 (Linux; Android 14; SM-S928B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
              }

              private val binder = LocalBinder()
              lateinit var persistentWebStack: FrameLayout
                  private set

              val tabs = mutableListOf<BrowserTab>()
              var activeTabId: Int = -1
                  private set
              private var nextTabId: Int = 1

              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null
              private val heartbeatHandler = Handler(Looper.getMainLooper())
              var activeProxySummary: String = "Dogrudan Baglanti"

              var onTabsUpdated: (() -> Unit)? = null
              var onActiveUrlChanged: ((String) -> Unit)? = null
              var onProgressChanged: ((Int) -> Unit)? = null

              inner class LocalBinder : Binder() {
                  fun getService(): BrowserForegroundService = this@BrowserForegroundService
              }

              private val backgroundHeartbeatRunnable = object : Runnable {
                  override fun run() {
                      val now = System.currentTimeMillis()
                      for (tab in tabs) {
                          tab.webView.onResume()
                          tab.webView.resumeTimers()
                          injectAlwaysAwakeScript(tab.webView, tab.isAntiAfkEnabled)

                          if (tab.autoRefreshSeconds > 0 && (now - tab.lastRefreshTimestamp) >= tab.autoRefreshSeconds * 1000L) {
                              tab.lastRefreshTimestamp = now
                              tab.webView.reload()
                          }
                      }
                      heartbeatHandler.postDelayed(this, 4000L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  acquireLocks()
                  persistentWebStack = FrameLayout(applicationContext).apply {
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      setBackgroundColor(Color.parseColor("#070913"))
                  }
                  createNewTab(loadHomeDashboard = true)
                  heartbeatHandler.postDelayed(backgroundHeartbeatRunnable, 4000L)
              }

              fun getActiveTab(): BrowserTab? = tabs.find { it.id == activeTabId } ?: tabs.firstOrNull()

              @SuppressLint("SetJavaScriptEnabled")
              fun createNewTab(initialUrl: String? = null, loadHomeDashboard: Boolean = false): BrowserTab {
                  val tabId = nextTabId++
                  val wv = AlwaysActiveWebView(applicationContext)
                  wv.setLayerType(View.LAYER_TYPE_HARDWARE, null)
                  wv.setBackgroundColor(Color.parseColor("#070913"))

                  wv.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      cacheMode = WebSettings.LOAD_DEFAULT
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      builtInZoomControls = true
                      displayZoomControls = false
                      setSupportZoom(true)
                      setSupportMultipleWindows(false)
                      userAgentString = DESKTOP_USER_AGENT
                  }

                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true)

                  val newTab = BrowserTab(
                      id = tabId,
                      webView = wv,
                      title = "Sekme $tabId",
                      url = initialUrl ?: "stark://home",
                      isDesktopMode = true,
                      isAntiAfkEnabled = true
                  )

                  wv.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean = false

                      override fun onPageStarted(view: WebView?, url: String?, favicon: android.graphics.Bitmap?) {
                          super.onPageStarted(view, url, favicon)
                          view?.let { injectAlwaysAwakeScript(it, newTab.isAntiAfkEnabled) }
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          view?.let { injectAlwaysAwakeScript(it, newTab.isAntiAfkEnabled) }
                          val cleanTitle = view?.title?.takeIf { it.isNotBlank() && !it.startsWith("data:text") }
                              ?: "Sekme ${newTab.id}"
                          newTab.title = if (cleanTitle.length > 16) cleanTitle.take(16) + "..." else cleanTitle
                          if (url != null && !url.startsWith("data:text/html")) {
                              newTab.url = url
                          }
                          if (newTab.id == activeTabId) {
                              onActiveUrlChanged?.invoke(newTab.url)
                          }
                          onTabsUpdated?.invoke()
                          updateNotification("${tabs.size} Sekme Aktif • ${newTab.title}")
                      }
                  }

                  wv.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          super.onProgressChanged(view, newProgress)
                          if (newTab.id == activeTabId) {
                              onProgressChanged?.invoke(newProgress)
                          }
                      }
                  }

                  persistentWebStack.addView(
                      wv,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  tabs.add(newTab)
                  switchToTab(newTab.id)

                  if (loadHomeDashboard || initialUrl == null) {
                      loadStarkCommandCenter(wv)
                  } else {
                      wv.loadUrl(initialUrl)
                  }

                  updateNotification("${tabs.size} Sekme Arka Planda Aktif")
                  return newTab
              }

              fun switchToTab(tabId: Int) {
                  activeTabId = tabId
                  for (tab in tabs) {
                      if (tab.id == tabId) {
                          tab.webView.translationX = 0f
                          tab.webView.alpha = 1f
                          tab.webView.bringToFront()
                          tab.webView.requestFocus()
                          onActiveUrlChanged?.invoke(tab.url)
                      } else {
                          tab.webView.translationX = 20000f
                          tab.webView.alpha = 1f
                      }
                      tab.webView.onResume()
                      tab.webView.resumeTimers()
                  }
                  onTabsUpdated?.invoke()
              }

              fun closeTab(tabId: Int) {
                  if (tabs.size <= 1) {
                      getActiveTab()?.let {
                          loadStarkCommandCenter(it.webView)
                          it.title = "Komuta Merkezi"
                          it.url = "stark://home"
                          onTabsUpdated?.invoke()
                          onActiveUrlChanged?.invoke(it.url)
                      }
                      return
                  }
                  val index = tabs.indexOfFirst { it.id == tabId }
                  if (index == -1) return
                  val removed = tabs.removeAt(index)
                  removed.webView.keepRunningInBackground = false
                  persistentWebStack.removeView(removed.webView)
                  removed.webView.destroy()

                  if (activeTabId == tabId) {
                      val nextTab = tabs[index.coerceAtMost(tabs.size - 1)]
                      switchToTab(nextTab.id)
                  } else {
                      onTabsUpdated?.invoke()
                  }
                  updateNotification("${tabs.size} Sekme Arka Planda Aktif")
              }

              fun toggleDesktopMode(tab: BrowserTab): Boolean {
                  tab.isDesktopMode = !tab.isDesktopMode
                  tab.webView.settings.userAgentString =
                      if (tab.isDesktopMode) DESKTOP_USER_AGENT else MOBILE_USER_AGENT
                  tab.webView.reload()
                  return tab.isDesktopMode
              }

              fun injectAlwaysAwakeScript(webView: WebView, enableAntiAfk: Boolean) {
                  val js = """
                      (function() {
                          try {
                              if (!window.__starkAwakeInstalled) {
                                  window.__starkAwakeInstalled = true;
                                  Object.defineProperty(document, 'hidden', { get: function() { return false; }, configurable: true });
                                  Object.defineProperty(document, 'webkitHidden', { get: function() { return false; }, configurable: true });
                                  Object.defineProperty(document, 'visibilityState', { get: function() { return 'visible'; }, configurable: true });
                                  document.hasFocus = function() { return true; };
                                  window.addEventListener('visibilitychange', function(e) { e.stopImmediatePropagation(); }, true);
                                  window.addEventListener('webkitvisibilitychange', function(e) { e.stopImmediatePropagation(); }, true);
                                  window.addEventListener('blur', function(e) { e.stopImmediatePropagation(); }, true);
                              }
                              if ($enableAntiAfk) {
                                  var evt = new MouseEvent('mousemove', {
                                      view: window, bubbles: true, cancelable: true,
                                      clientX: Math.floor(Math.random() * 300) + 100,
                                      clientY: Math.floor(Math.random() * 200) + 100
                                  });
                                  document.dispatchEvent(evt);
                              }
                          } catch(e) {}
                      })();
                  """.trimIndent()
                  webView.evaluateJavascript(js, null)
              }

              fun sendGameKey(key: String, keyCode: Int) {
                  val activeWv = getActiveTab()?.webView ?: return
                  val js = """
                      (function() {
                          try {
                              var target = document.activeElement || document.body || window;
                              ['keydown', 'keypress', 'keyup'].forEach(function(type) {
                                  var ev = new KeyboardEvent(type, {
                                      key: '$key',
                                      code: '${if (key == " ") "Space" else "Key" + key.uppercase()}',
                                      keyCode: $keyCode,
                                      which: $keyCode,
                                      bubbles: true,
                                      cancelable: true
                                  });
                                  target.dispatchEvent(ev);
                                  window.dispatchEvent(ev);
                                  document.dispatchEvent(ev);
                              });
                          } catch(e) {}
                      })();
                  """.trimIndent()
                  activeWv.evaluateJavascript(js, null)
              }

