                      chipLayout.addView(titleView)
                      chipLayout.addView(closeView)

                      val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, 78).apply {
                          marginEnd = 10
                      }
                      tabStripLayout.addView(chipLayout, lp)
                  }
